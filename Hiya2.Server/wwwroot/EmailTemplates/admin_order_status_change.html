<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Order Status Updated - HIYAGHAR Admin</title>
  <style>
    body { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 24px; color: #222222; }
    .container { max-width: 620px; background-color: #ffffff; margin: 0 auto; border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .header { background-color: #11223a; padding: 22px 28px; border-bottom: 3px solid #cb992c; }
    .header-title { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: 1.5px; color: #ffffff; text-transform: uppercase; }
    .header-subtitle { margin: 4px 0 0 0; font-size: 13px; color: #cb992c; font-weight: 600; letter-spacing: 0.5px; }
    .content { padding: 28px; }
    .section-title { font-size: 14px; font-weight: 700; color: #11223a; text-transform: uppercase; letter-spacing: 0.5px; margin: 0 0 10px 0; }
    .info-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; background-color: #fdfbf7; border: 1px solid #e8e2c9; border-radius: 6px; }
    .info-table td { padding: 10px 14px; font-size: 13.5px; border-bottom: 1px solid #f0eae0; }
    .info-table td.label { width: 35%; font-weight: 600; color: #555555; }
    .info-table td.value { width: 65%; color: #11223a; font-weight: 500; }
    .info-table tr:last-child td { border-bottom: none; }
    .footer { background-color: #f8fafc; padding: 16px 28px; text-align: center; font-size: 12px; color: #94a3b8; border-top: 1px solid #e2e8f0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-title">HIYAGHAR ADMIN</div>
      <div class="header-subtitle">Order Status Change Notification</div>
    </div>
    
    <div class="content">
      <div class="section-title">Order Details</div>
      <table class="info-table">
        <tr>
          <td class="label">Order Number</td>
          <td class="value"><strong>{{orderNumber}}</strong></td>
        </tr>
        <tr>
          <td class="label">Customer Name</td>
          <td class="value">{{customerName}}</td>
        </tr>
        <tr>
          <td class="label">Customer Email</td>
          <td class="value">{{customerEmail}}</td>
        </tr>
        <tr>
          <td class="label">Updated Status</td>
          <td class="value" style="font-weight: 700; color: #11223a;">{{newStatus}}</td>
        </tr>
        <tr>
          <td class="label">Total Amount</td>
          <td class="value">₹{{totalAmount}}</td>
        </tr>
      </table>
    </div>

    <div class="footer">
      HIYAGHAR Store Management System &bull; Confidential
    </div>
  </div>
</body>
</html>
